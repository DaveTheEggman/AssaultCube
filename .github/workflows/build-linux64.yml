name: build linux64 binaries

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/**'
      - '.github/workflows/build-linux64.yml'
  pull_request:
    paths:
      - 'source/**'
      - '.github/workflows/build-linux64.yml'

jobs:
  linux64:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            make \
            libsdl2-dev \
            libsdl2-image-dev \
            zlib1g-dev \
            libogg-dev \
            libvorbis-dev \
            libopenal-dev \
            libx11-dev \
            libgl-dev
        shell: bash

      - name: prepare production build
        run: sed -i 's@^//#define PRODUCTION$@#define PRODUCTION@' source/src/cube.h
        shell: bash

      - name: make
        run: |
          cd source/src
          make clean
          make -j"$(nproc)"
          make install
        shell: bash

      - name: prepare artifact
        run: |
          mkdir -p dist
          cp bin_unix/native_client dist/linux_64_client
          cp bin_unix/native_server dist/linux_64_server
          echo "Run chmod 750 linux_64_* to make the binaries executable." > dist/info-make-executable.txt
        shell: bash

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux64-binaries
          path: dist/
