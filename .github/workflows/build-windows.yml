name: build windows binaries

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'source/**'
      - '.github/workflows/build-windows.yml'

jobs:
  windows:
    name: build
    runs-on: windows-2022
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install Windows XP build tools & Clang
        run: |
          "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\setup.exe" modify --quiet --norestart --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" --add Microsoft.VisualStudio.Component.WinXP --add Microsoft.VisualStudio.Component.VC.Llvm.Clang --add Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset
          if errorlevel 1 exit /b %errorlevel%
        shell: cmd

      - name: setup msbuild
        uses: microsoft/setup-msbuild@v3

      - name: verify clang
        run: clang-cl --version
        shell: cmd

      - name: compile client
        run: msbuild .\source\vcpp\assaultcube.sln /p:Configuration=Release /p:CLToolPath="C:\Program Files\LLVM\bin" /p:CLToolExe=clang-cl.exe
        shell: cmd

      - name: compile server
        run: msbuild .\source\vcpp\assaultcube.sln /p:Configuration=Standalone /p:CLToolPath="C:\Program Files\LLVM\bin" /p:CLToolExe=clang-cl.exe
        shell: cmd

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-binaries
          path: bin_win32/ac_*.exe
